# OrbStack:  HOST_PORT=7900 docker compose up --build -d   ->  http://127.0.0.1:7900/api/health
# The server binds 0.0.0.0 INSIDE the container (AI_GUARD_BIND is the opt-in), but the port is published on loopback only.
# The embedded sidecar listens on the container's own loopback and is not published. No host mounts, no docker socket,
# no host network. Do not change the 127.0.0.1 below.
name: ai-guard-demo

services:
  ai-guard-demo:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7900}:7900"
    environment:
      SHELF_URL: ${SHELF_URL:-https://local.ping-devops.com:8443/demo-shelf}
      AI_GUARD_PORT: "7900"
      AI_GUARD_BIND: 0.0.0.0
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-ai-guard-demo.local.ping-devops.com}
      # Real mode (owner-set, in this app's own .env beside the compose file, gitignored): an external AI Guard
      # sidecar the gateway calls over loopback. Unset = Mock only (the toggle is disabled with a how-to).
      AI_GUARD_SIDECAR_URL: ${AI_GUARD_SIDECAR_URL:-}
      # Explicit owner opt-in for an external sidecar on any loopback port (see .env.example). Note:
      # from INSIDE the container, 127.0.0.1 is the container itself — a sidecar on this Mac is only
      # reachable if it publishes on 0.0.0.0 (not the default) or the lab runs from a host checkout.
      AI_GUARD_ALLOW_EXTERNAL_SIDECAR: ${AI_GUARD_ALLOW_EXTERNAL_SIDECAR:-}
      AI_GUARD_SIDECAR_PORT: ${AI_GUARD_SIDECAR_PORT:-7902}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7900/api/health').then(r=>r.json()).then(j=>process.exit(j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
